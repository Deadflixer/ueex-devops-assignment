global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: ueex-demo

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox:9115"]

  # Синтетична перевірка застосунку:
  #  via-nginx — повний шлях користувача: TLS -> nginx -> Kanboard -> PostgreSQL
  #  direct    — напряму в контейнер app (щоб відрізнити падіння nginx від app)
  - job_name: blackbox-app
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://nginx/healthcheck.php"]
        labels: { probe: via-nginx }
      - targets: ["http://app/healthcheck.php"]
        labels: { probe: direct }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
